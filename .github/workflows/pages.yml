name: Deploy (GitHub Pages)
# Serves the site on the repo's Pages URL. With a custom domain set in
# Settings → Pages, base_path is empty and the site is built for the domain root
# (indexable). Without one, it is built for /<repo>/ and marked noindex.
on:
  push:
    branches: [claude/tender-pasteur-a0loor, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: node scripts/rebase.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - run: npm run check:links
        if: steps.pages.outputs.base_path == ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
